[tools]
node = "24.16.0"
"npm:wrangler" = "4.137.0"

[env]
CLOUDFLARE_ACCOUNT_ID = "8fc12c0157e8c6840fc0dd50969d8000"

[tasks.install]
run = "npm ci"

[tasks.build]
run = ["npm run db:bundle", "npx --no-install opennextjs-cloudflare build"]

[tasks.deploy]
env = { OPEN_NEXT_DEPLOY = "true" }
run = "wrangler deploy"

[tasks.dry-run]
env = { OPEN_NEXT_DEPLOY = "true" }
run = "wrangler deploy --dry-run --outdir .wrangler/artifact"

[tasks.typecheck]
run = "npx --no-install tsc --noEmit"

[tasks."password:check"]
run = "node --import tsx scripts/password-change-check.ts"

[tasks."password:lint"]
run = "npx --no-install eslint src/lib/auth src/lib/api/auth.ts src/lib/api/key-auth.ts src/lib/realtime/utils.ts src/components/auth/auth-guard.tsx src/components/settings/change-password-form.tsx src/app/\"(auth)\"/change-password src/app/api/settings/password scripts/password-change-check.ts"

[tasks."password:dev"]
env = { MAILFLARE_RUNTIME = "node", DATA_DIR = "work/password-preview", HOST = "127.0.0.1", PORT = "3019", SMTP_INBOUND_PORT = "0" }
run = "npm run dev:node"

[tasks."theme:dev"]
env = { MAILFLARE_RUNTIME = "node", DATA_DIR = "work/theme-preview", HOST = "127.0.0.1", PORT = "3024", SMTP_INBOUND_PORT = "0" }
run = "npm run dev:node"

[tasks."theme:build"]
run = "npm run build:node"

[tasks."theme:lint"]
run = "npx --no-install eslint src/components/theme-*.ts src/components/theme-*.tsx src/components/appearance-controls.tsx src/components/language-switcher.tsx src/components/sidebar-footer.tsx src/app/layout.tsx"

[tasks.migrate]
run = "wrangler d1 migrations apply DB --remote"

[tasks.wrangler]
run = "wrangler"

[tasks."i18n:check"]
run = "node scripts/check-i18n.mjs"

[tasks."i18n:extract"]
run = "node scripts/extract-i18n.mjs"

[tasks."i18n:lint"]
run = "npx --no-install eslint src/i18n src/components/language-switcher.tsx scripts/check-i18n.mjs scripts/extract-i18n.mjs"

[tasks."preview:local"]
env = { OPEN_NEXT_DEPLOY = "true" }
run = "wrangler dev --local --ip 127.0.0.1 --port 8788"

[tasks."trash:check"]
run = "node --import tsx scripts/permanent-delete-check.ts"

[tasks."trash:dev"]
env = { MAILFLARE_RUNTIME = "node", DATA_DIR = "work/trash-preview", HOST = "127.0.0.1", PORT = "3018", SMTP_INBOUND_PORT = "0" }
run = "npm run dev:node"

[tasks."trash:lint"]
run = "npx --no-install eslint src/app/api/messages/bulk src/lib/email/permanent-delete.ts src/components/messages/permanent-delete.ts src/components/messages/bulk-message-toolbar.tsx src/components/messages/bulk-message-selection-pane.tsx src/components/messages/message-split-layout.tsx src/components/messages/message-list-row-actions.tsx src/components/messages/message-folder-page.tsx src/components/messages/thread-message-actions.tsx src/components/messages/utils.ts src/components/message-actions src/lib/messages/actions.ts scripts/permanent-delete-check.ts"
